name: Build


on:
  workflow_dispatch:
  pull_request:
    name: Build
  workflow_call:


jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Nuitka needs patchelf for standalone/onefile builds on Linux
      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Install app + dependencies
        run: pip install .

      - uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: build.py
          mode: onefile
          output-dir: deployment

      - name: Install Linux GUI test dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      - uses: actions/upload-artifact@v4
        with:
          name: prayer-pause-${{ runner.os }}
          path: deployment/prayer-pause*
          if-no-files-found: error
