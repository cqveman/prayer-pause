[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "prayer-pause"
description = "A GUI based prayer app."
authors = [{ name = "Abdullah Alhamdi", email = "trymemain.pb.hug@gmail.com" }]

